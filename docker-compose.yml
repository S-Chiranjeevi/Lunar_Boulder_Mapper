version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      MOONSAFE_MODEL_PATH: ${MOONSAFE_MODEL_PATH:-}
      MOONSAFE_HOST: "0.0.0.0"
      MOONSAFE_PORT: "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
