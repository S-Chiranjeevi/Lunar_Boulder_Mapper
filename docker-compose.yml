services:
  backend:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      MOONSAFE_DATA_DIR: /data
      MOONSAFE_WEIGHTS_PATH: ${MOONSAFE_WEIGHTS_PATH:-/models/moonsafe-yolov8n-lunar-10pct-5ep.pt}
      MOONSAFE_CORS_ORIGINS: ${MOONSAFE_CORS_ORIGINS:-}
      PYTHONPATH: /app/backend:/app
    volumes:
      - ${MOONSAFE_HOST_DATA_DIR:-./.moonsafe_data}:/data
      - ${MOONSAFE_HOST_MODELS_DIR:-./models}:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
